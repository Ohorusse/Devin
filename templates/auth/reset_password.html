{% extends "base.html" %}
{% block title %}Nouveau mot de passe – TicketSecure{% endblock %}
{% block content %}
<div class="centered">
    <div style="width:100%;max-width:440px;">
        <div class="card">
            <div class="card-body-lg">
                <h1 class="text-center mb-3">Nouveau mot de passe</h1>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-group">
                        <label for="mot_de_passe">Nouveau mot de passe</label>
                        <input type="password" id="mot_de_passe" name="mot_de_passe"
                               placeholder="12 caractères minimum" minlength="12" required autofocus>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-full btn-lg">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
