{% extends "base.html" %}
{% block title %}Inscription – TicketSecure{% endblock %}
{% block content %}
<div class="centered">
    <div style="width:100%;max-width:440px;">
        <div class="card">
            <div class="card-body-lg">
                <h1 class="text-center mb-3">Inscription</h1>
                <form method="POST" id="form-inscription" novalidate>
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-group">
                        <label for="prenom">Prénom</label>
                        <input type="text" id="prenom" name="prenom" required autofocus>
                    </div>
                    <div class="form-group">
                        <label for="nom">Nom</label>
                        <input type="text" id="nom" name="nom" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="votre@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="mot_de_passe">Mot de passe</label>
                        <input type="password" id="mot_de_passe" name="mot_de_passe"
                               placeholder="12 caractères minimum" minlength="12" required>
                        <span class="form-hint">Au moins 12 caractères.</span>
                    </div>
                    <div class="form-group">
                        <label for="mot_de_passe_confirm">Confirmer le mot de passe</label>
                        <input type="password" id="mot_de_passe_confirm" name="mot_de_passe_confirm"
                               placeholder="••••••••••••" required>
                        <span class="form-error" id="err-confirm">Les mots de passe ne correspondent pas.</span>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-full btn-lg">Créer mon compte</button>
                    </div>
                </form>
                <p class="form-footer">
                    Déjà un compte ? <a href="{{ url_for('auth.login') }}">Se connecter</a>
                </p>
            </div>
        </div>
    </div>
</div>
<script>
document.getElementById('form-inscription').addEventListener('submit', function(e) {
    const pwd = document.getElementById('mot_de_passe').value;
    const confirm = document.getElementById('mot_de_passe_confirm').value;
    const err = document.getElementById('err-confirm');
    if (pwd !== confirm) {
        e.preventDefault();
        err.classList.add('visible');
        document.getElementById('mot_de_passe_confirm').classList.add('input-error');
    } else {
        err.classList.remove('visible');
        document.getElementById('mot_de_passe_confirm').classList.remove('input-error');
    }
});
document.getElementById('mot_de_passe_confirm').addEventListener('input', function() {
    const pwd = document.getElementById('mot_de_passe').value;
    const err = document.getElementById('err-confirm');
    if (this.value && this.value !== pwd) {
        err.classList.add('visible');
        this.classList.add('input-error');
    } else {
        err.classList.remove('visible');
        this.classList.remove('input-error');
    }
});
</script>
{% endblock %}
