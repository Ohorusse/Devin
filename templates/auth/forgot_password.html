{% extends "base.html" %}
{% block title %}Mot de passe oublié – TicketSecure{% endblock %}
{% block content %}
<div class="centered">
    <div style="width:100%;max-width:440px;">
        <div class="card">
            <div class="card-body-lg">
                <h1 class="text-center mb-1">Mot de passe oublié</h1>
                <p class="text-center text-muted mb-3">Un lien de réinitialisation vous sera envoyé par e-mail.</p>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="form-group">
                        <label for="email">Adresse e-mail</label>
                        <input type="email" id="email" name="email" placeholder="votre@email.com" required autofocus>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-full btn-lg">Envoyer le lien</button>
                    </div>
                </form>
                <p class="form-footer"><a href="{{ url_for('auth.login') }}">← Retour à la connexion</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
