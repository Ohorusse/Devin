{% extends "base.html" %}
{% block title %}Nouvel événement – Admin{% endblock %}
{% block content %}
<div class="page-sm">
    <h1 class="mb-3">Nouvel événement</h1>
    <div class="card">
        <div class="card-body-lg">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label>Titre</label>
                    <input type="text" name="titre" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label>Date et heure</label>
                    <input type="datetime-local" name="date_heure" required>
                </div>
                <div class="form-group">
                    <label>Lieu</label>
                    <input type="text" name="lieu" required>
                </div>
                <div class="form-group">
                    <label>Prix unitaire (€)</label>
                    <input type="number" name="prix_unitaire" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label>Capacité totale</label>
                    <input type="number" name="capacite_totale" min="1" required>
                </div>
                <div class="form-group">
                    <label>Catégorie</label>
                    <input type="text" name="categorie" placeholder="concert, théâtre, danse…">
                </div>
                <div class="form-group">
                    <label>URL de l'affiche (optionnel)</label>
                    <input type="url" name="illustration_url">
                </div>
                <div class="form-actions flex gap-1">
                    <button type="submit" class="btn btn-primary btn-lg">Créer l'événement</button>
                    <a href="{{ url_for('admin.spectacles') }}" class="btn btn-secondary btn-lg">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
